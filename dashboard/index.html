<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevLink Dashboard</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script data-cfasync="false">try{var t=localStorage.getItem('devlink-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <style>
    /* Palette copied from /styles.css so the dashboard reads as the same product. */
    :root, [data-theme="dark"] {
      --bg:      #151515;
      --bg2:     #1c1c1c;
      --bg3:     #222222;
      --white:   #f5f5f5;
      --muted:   #888888;
      --border:  #2e2e2e;
      --accent:  #ffffff;
      --accent-dim:    rgba(255, 255, 255, 0.08);
      --accent-glow:   rgba(255, 255, 255, 0.15);
      --accent-strong: rgba(255, 255, 255, 0.25);
      --glass-bg:      rgba(28, 28, 28, 0.55);
      --glass-border:  rgba(255, 255, 255, 0.06);
      --nav-bg:        rgba(21, 21, 21, 0.7);
      --input-bg:      #1a1a1a;
      --input-focus:   #282828;
      --card-hover:    rgba(255, 255, 255, 0.05);
      --success: #34d399;
      --warning: #fbc02d;
      --danger:  #ef5350;
      --link:    #7dd3fc;
    }
    [data-theme="light"] {
      --bg:      #f5f5f5;
      --bg2:     #ebebeb;
      --bg3:     #e0e0e0;
      --white:   #111111;
      --muted:   #666666;
      --border:  #d0d0d0;
      --accent:  #111111;
      --accent-dim:    rgba(0, 0, 0, 0.08);
      --accent-glow:   rgba(0, 0, 0, 0.12);
      --accent-strong: rgba(0, 0, 0, 0.20);
      --glass-bg:      rgba(235, 235, 235, 0.55);
      --glass-border:  rgba(0, 0, 0, 0.06);
      --nav-bg:        rgba(245, 245, 245, 0.7);
      --input-bg:      #f9f9f9;
      --input-focus:   #ffffff;
      --card-hover:    rgba(0, 0, 0, 0.05);
      --success: #059669;
      --warning: #d97706;
      --danger:  #d32f2f;
      --link:    #2563eb;
    }
    /* Aliases so the dashboard's own rules keep their semantic names. */
    :root { --panel: var(--bg2); --text: var(--white); }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.3s, color 0.3s;
    }
    /* Background lives on <html> only, so body::before can sit behind the content. */
    html { background: var(--bg); }
    body { position: relative; min-height: 100vh; }

    /* Ambient grid, fading out over the data area. */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      -webkit-mask-image: linear-gradient(to bottom, black 0%, black 90px, transparent 280px);
      mask-image: linear-gradient(to bottom, black 0%, black 90px, transparent 280px);
    }
    [data-theme="light"] body::before { opacity: 0.55; }
    /* The signed-out screens bring their own grid — don't stack two of them. */
    body:has(.center)::before { display: none; }
    /* Noise texture — same grain as the rest of the site. */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    header {
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; padding: 14px 28px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--nav-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand img { width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0; }
    header h1 {
      margin: 0; display: flex; align-items: baseline; gap: 9px;
      font-family: 'Syne', sans-serif; font-size: 1.15rem; font-weight: 800;
      letter-spacing: -0.02em; color: var(--text); white-space: nowrap;
    }
    header h1 .sep { color: var(--border); font-weight: 400; }
    header h1 .sub {
      font-family: 'DM Sans', sans-serif; font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    }
    .header-right { display: flex; align-items: center; gap: 14px; }
    header .who {
      color: var(--muted); font-size: 10px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
    }
    .theme-toggle {
      background: none; border: 1px solid var(--glass-border); border-radius: 100px;
      padding: 6px 13px; cursor: pointer; color: var(--muted); font: inherit; font-size: 12px;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      transition: border-color .2s, color .2s;
    }
    .theme-toggle:hover { border-color: var(--muted); color: var(--text); }
    .theme-toggle svg { flex-shrink: 0; }

    nav {
      display: flex; gap: 6px; padding: 0 28px;
      border-bottom: 1px solid var(--border);
    }
    nav button {
      position: relative; background: transparent; border: 0; color: var(--muted);
      padding: 13px 14px 12px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 500;
      border-radius: 8px 8px 0 0;
      transition: color .2s, background .2s;
    }
    nav button::after {
      content: ''; position: absolute; bottom: -1px; left: 14px; right: 14px;
      height: 1.5px; background: var(--accent); transform: scaleX(0); transform-origin: left;
      transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav button:hover { color: var(--text); background: var(--card-hover); }
    nav button.active { color: var(--text); font-weight: 600; }
    nav button.active::after { transform: scaleX(1); }

    main { padding: 32px 28px 80px; max-width: 1400px; margin: 0 auto; }
    section { display: none; }
    section.active { display: block; }
    h2 {
      position: relative; display: inline-block;
      margin: 0 0 18px; padding-bottom: 8px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
    }
    h2::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 100%;
      height: 1.5px; background: var(--muted); opacity: 0.4;
    }
    table {
      width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: 14px;
      overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    }
    th, td {
      text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      background: var(--bg3); color: var(--muted); font-weight: 600; font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap;
    }
    td { font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover > td { background: var(--card-hover); }

    .btn {
      background: var(--accent); color: var(--bg); border: 1px solid transparent;
      padding: 6px 15px; border-radius: 100px; cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 600; white-space: nowrap;
      transition: transform .2s, box-shadow .3s, background .2s, border-color .2s;
    }
    .btn:hover { transform: scale(1.03); box-shadow: 0 0 16px var(--accent-glow); }
    .btn:active { transform: scale(0.98); }
    .btn.ghost { background: transparent; border-color: var(--border); color: var(--text); }
    .btn.ghost:hover { border-color: var(--accent); box-shadow: 0 0 14px var(--accent-dim); }
    /* Semantic actions stay outlined — the site only ever fills with the accent. */
    .btn.danger  { background: transparent; color: var(--danger);  border-color: rgba(239, 83, 80, 0.45); }
    .btn.success { background: transparent; color: var(--success); border-color: rgba(52, 211, 153, 0.50); }
    .btn.danger:hover  { background: rgba(239, 83, 80, 0.12);  border-color: var(--danger);  box-shadow: 0 0 14px rgba(239, 83, 80, 0.20); }
    .btn.success:hover { background: rgba(52, 211, 153, 0.12); border-color: var(--success); box-shadow: 0 0 14px rgba(52, 211, 153, 0.20); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .empty {
      padding: 52px 24px; text-align: center; color: var(--muted); font-size: 13px;
      background: var(--glass-bg); border: 1px dashed var(--border); border-radius: 14px;
    }
    .pill {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      background: var(--bg3); color: var(--muted); border: 1px solid var(--border);
      vertical-align: middle;
    }
    .pill.ok      { background: rgba(52, 211, 153, 0.10); color: var(--success); border-color: rgba(52, 211, 153, 0.30); }
    .pill.pending { background: rgba(251, 192, 45, 0.10); color: var(--warning); border-color: rgba(251, 192, 45, 0.30); }
    .pill.danger  { background: rgba(239, 83, 80, 0.10);  color: var(--danger);  border-color: rgba(239, 83, 80, 0.30); }
    /* Stage colour coding (row tints that hold up on both themes) */
    tr.stg-under_review > td, tr.stg-in_progress > td { background: rgba(251, 192, 45, 0.055); }
    tr.stg-accepted > td  { background: rgba(52, 211, 153, 0.05); }
    tr.stg-completed > td { background: rgba(52, 211, 153, 0.08); }
    tr.stg-declined > td  { background: rgba(239, 83, 80, 0.055); }
    tbody tr.stg-under_review:hover > td, tbody tr.stg-in_progress:hover > td { background: rgba(251, 192, 45, 0.11); }
    tbody tr.stg-accepted:hover > td  { background: rgba(52, 211, 153, 0.10); }
    tbody tr.stg-completed:hover > td { background: rgba(52, 211, 153, 0.14); }
    tbody tr.stg-declined:hover > td  { background: rgba(239, 83, 80, 0.11); }
    select.stage.s-amber { color: var(--warning); border-color: rgba(251, 192, 45, 0.40); }
    select.stage.s-green { color: var(--success); border-color: rgba(52, 211, 153, 0.40); }
    select.stage.s-rose  { color: var(--danger);  border-color: rgba(239, 83, 80, 0.40); }
    h2 + h2, table + h2, .table-scroll + h2, .empty + h2 { margin-top: 34px; }
    .table-scroll { border-radius: 14px; }
    /* ── Signed-out screens: the one hero moment ── */
    .center {
      position: relative; overflow: hidden; text-align: center; padding: 24px;
      min-height: calc(100vh - 65px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding-bottom: 12vh;
    }
    /* Scrolling grid lines */
    .center::before {
      content: ''; position: absolute; inset: -60px;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.9;
      -webkit-mask-image: radial-gradient(ellipse 85% 75% at center, black 10%, transparent 78%);
      mask-image: radial-gradient(ellipse 85% 75% at center, black 10%, transparent 78%);
      animation: gridScroll 14s linear infinite;
      pointer-events: none; z-index: 0;
    }
    /* Brighter grid revealed under the cursor */
    .dash-grid-cursor {
      position: absolute; inset: -60px;
      background-image:
        linear-gradient(var(--muted) 1px, transparent 1px),
        linear-gradient(90deg, var(--muted) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.45;
      animation: gridScroll 14s linear infinite;
      -webkit-mask-image: radial-gradient(circle 220px at -999px -999px, black 0%, transparent 100%);
      mask-image: radial-gradient(circle 220px at -999px -999px, black 0%, transparent 100%);
      pointer-events: none; z-index: 0;
    }
    /* Glow orb behind the card */
    .center::after {
      content: ''; position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%);
      width: 900px; height: 700px;
      background: radial-gradient(ellipse, var(--accent-dim) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }
    @keyframes gridScroll { from { background-position: 0 0; } to { background-position: 60px 60px; } }
    @keyframes borderSweep { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

    .login-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 520px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: 20px;
      padding: 60px 52px 52px;
      box-shadow: 0 24px 60px -24px rgba(0,0,0,0.5);
    }
    /* Slow sweep around the card edge */
    .login-card::before {
      content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
      background: linear-gradient(135deg, transparent 30%, var(--accent) 50%, transparent 70%);
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0.5; animation: borderSweep 6s linear infinite;
      pointer-events: none;
    }
    .login-badge {
      display: inline-flex; align-items: center;
      background: var(--bg3); border: 1px solid var(--glass-border); border-radius: 100px;
      padding: 8px 18px; margin-bottom: 26px;
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
    }
    .login-badge.warn {
      color: var(--warning); border-color: rgba(251, 192, 45, 0.25); background: rgba(251, 192, 45, 0.08);
    }
    .center h2 {
      display: block; margin: 0 0 16px; padding: 0;
      font-family: 'Syne', sans-serif; font-size: clamp(1.9rem, 4.5vw, 2.4rem); font-weight: 800;
      line-height: 1.05; text-transform: none; letter-spacing: -0.03em; color: var(--text);
    }
    .center h2::after { display: none; }
    .center p { margin: 0 0 34px; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .center .btn {
      width: 100%; padding: 16px 24px; font-size: 15px; font-weight: 600;
      letter-spacing: 0.01em;
    }
    .center .btn:hover { transform: scale(1.02); box-shadow: 0 0 24px var(--accent-glow); }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
      background: var(--bg3); border: 1px solid var(--border);
      padding: 2px 7px; border-radius: 6px; color: var(--muted);
    }
    /* Row actions */
    td .row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .linkbtn {
      background: none; border: 0; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600;
      cursor: pointer; padding: 5px 8px; border-radius: 100px; white-space: nowrap;
      transition: color .2s, background .2s;
    }
    .linkbtn:hover { color: var(--text); background: var(--card-hover); }
    select.stage {
      font: inherit; font-size: 12px; font-weight: 500; color: var(--text);
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 9px; cursor: pointer;
      transition: border-color .2s, background .2s, box-shadow .3s;
    }
    select.stage:hover  { background: var(--input-focus); }
    select.stage:focus  { outline: none; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-dim); }
    select option { background: var(--bg3); color: var(--white); }

    /* Expandable detail row */
    tbody tr.detail-row > td, tbody tr.detail-row:hover > td { background: var(--bg3); padding: 0; }
    .detail-inner { padding: 18px 20px; border-top: 1px dashed var(--border); }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 28px; margin: 0; }
    .detail-grid .field { min-width: 0; }
    .detail-grid dt { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 3px; }
    .detail-grid dd { margin: 0; font-size: 13px; color: var(--text); word-break: break-word; white-space: pre-wrap; }
    .detail-grid dd a { color: var(--link); }
    .detail-grid .wide { grid-column: 1 / -1; }

    /* ── Phase 8b: overview + project cards ── */
    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 18px; }
    .toolbar .spacer { flex: 1; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 100px; overflow: hidden; }
    .seg button {
      background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600;
      padding: 7px 15px; cursor: pointer; transition: background .2s, color .2s;
    }
    .seg button.on { background: var(--accent); color: var(--bg); }
    .seg button:not(.on):hover { color: var(--text); background: var(--card-hover); }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 0 0 30px; }
    .stat-tile {
      position: relative; padding: 18px 18px 16px; border-radius: 14px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .stat-tile .stat-value { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
    .stat-tile .stat-label { margin-top: 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .stat-tile.warn  .stat-value { color: var(--warning); }
    .stat-tile.rose  .stat-value { color: var(--danger); }
    .stat-tile.green .stat-value { color: var(--success); }
    .stat-tile.click { cursor: pointer; transition: border-color .2s, box-shadow .3s, transform .2s; }
    .stat-tile.click:hover { border-color: var(--muted); box-shadow: 0 10px 44px rgba(0,0,0,0.14); transform: translateY(-1px); }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .proj-card {
      display: flex; flex-direction: column; gap: 12px; padding: 18px;
      border-radius: 16px; background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.08); transition: border-color .2s, box-shadow .3s;
    }
    .proj-card:hover { border-color: var(--muted); box-shadow: 0 12px 48px rgba(0,0,0,0.14); }
    .proj-card.mine { border-color: var(--accent-strong); }
    .proj-card.declined { border-color: rgba(239, 83, 80, 0.45); }
    .proj-card .pc-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .proj-card .pc-id { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
    .proj-card .pc-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; margin: 2px 0 0; }
    .proj-card .pc-meta { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); }
    .proj-card .pc-meta b { color: var(--text); font-weight: 600; }
    .proj-card .pc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .proj-card .pc-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
    .proj-card .pc-foot .spacer { flex: 1; }

    .chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em;
      background: var(--bg3); color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
    }
    .chip.paid    { background: rgba(52,211,153,0.10); color: var(--success); border-color: rgba(52,211,153,0.30); }
    .chip.partial { background: rgba(251,192,45,0.10); color: var(--warning); border-color: rgba(251,192,45,0.30); }
    .chip.unpaid  { background: rgba(239,83,80,0.10);  color: var(--danger);  border-color: rgba(239,83,80,0.30); }
    .chip.due     { background: rgba(251,192,45,0.10); color: var(--warning); border-color: rgba(251,192,45,0.30); }
    .chip.overdue { background: rgba(239,83,80,0.10);  color: var(--danger);  border-color: rgba(239,83,80,0.30); }
    .chip.stale   { background: rgba(239,83,80,0.08);  color: var(--danger);  border-color: rgba(239,83,80,0.25); }
    .chip.mine    { background: var(--accent-dim); color: var(--text); border-color: var(--accent-strong); }
    .chip.dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }

    .attn-row {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px;
      background: var(--glass-bg); border: 1px solid var(--glass-border); margin-bottom: 8px;
    }

    .attn-row .spacer { flex: 1; }

    /* Modal (create / edit enquiry) */
    .modal-overlay {

      padding: 20px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);

    .modal-field textarea { min-height: 120px; resize: vertical; }

    /* ── Responsive ── */

    }
    @media (prefers-reduced-motion: reduce) {
      .center::before, .dash-grid-cursor, .login-card::before { animation: none; }
    }
  </style>

<script type="module">
// ============================================================

const SUPABASE_URL      = 'https://qgqpwxitbdjoggiwtjra.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFncXB3eGl0YmRqb2dnaXd0anJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNTM2NDYsImV4cCI6MjA5MDkyOTY0Nn0.7vXKc33-Ok-V7nOIoxw2gZ0LxjdrR0ZEp59Y1Cgej4w';

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ── Money helpers ───────────────────────────────────────────
const pounds = pence => `£${(Number(pence ?? 0) / 100).toFixed(2)}`;
const fmt    = iso   => iso ? new Date(iso).toLocaleString() : '—';
const escape = s     => (s ?? '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── Detail-view helpers ─────────────────────────────────────
// `notes` on enquiries/people is a JSON blob holding the extra
// form fields the tables don't have columns for. Parse it safely.
function parseNotes(raw) {
  if (raw == null) return {};
  if (typeof raw === 'object') return raw;
  try { const o = JSON.parse(raw); return (o && typeof o === 'object') ? o : { note: raw }; }
  catch { return { note: raw }; }
}

const isUrl = v => typeof v === 'string' && /^https?:\/\//i.test(v.trim());

// Render one value: links become anchors, everything else escaped text.
function detailValue(v) {
  if (Array.isArray(v)) v = v.join(', ');
  if (v == null || v === '') return null;
  const s = String(v);
  return isUrl(s) ? `<a href="${escape(s)}" target="_blank" rel="noopener">${escape(s)}</a>` : escape(s);
}

// pairs: [ [label, value, {wide?:bool}], ... ] — empties dropped.
function detailGrid(pairs) {
  const cells = pairs.map(([label, value, opt]) => {
    const rendered = detailValue(value);
    if (rendered == null) return '';
    return `<div class="field ${opt?.wide ? 'wide' : ''}"><dt>${escape(label)}</dt><dd>${rendered}</dd></div>`;
  }).filter(Boolean).join('');
  return `<dl class="detail-grid">${cells || '<div class="field"><dd>No extra details.</dd></div>'}</dl>`;
}

// A collapsed detail <tr> that a "See more" button toggles.
function detailRow(id, colspan, innerHtml) {
  return `<tr class="detail-row" id="detail-${id}" style="display:none"><td colspan="${colspan}"><div class="detail-inner">${innerHtml}</div></td></tr>`;
}

// Wire every [data-toggle] button to show/hide its detail row.
function wireToggles() {
  document.querySelectorAll('[data-toggle]').forEach(b => {
    b.onclick = () => {
      const row = document.getElementById(`detail-${b.dataset.toggle}`);
      if (!row) return;
      const open = row.style.display !== 'none';
      row.style.display = open ? 'none' : 'table-row';
      b.textContent = open ? 'See more' : 'See less';
    };
  });
}

// Cursor-following grid reveal on the signed-out screens. Purely decorative —
// it only rewrites a CSS mask on the .dash-grid-cursor layer.
function wireGridCursor() {
  const scene = document.querySelector('.center');
  const layer = scene?.querySelector('.dash-grid-cursor');
  if (!scene || !layer) return;
  const hide = 'radial-gradient(circle 220px at -999px -999px, black 0%, transparent 100%)';
  scene.onmousemove = e => {
    const rect = scene.getBoundingClientRect();
    const mask = `radial-gradient(circle 220px at ${e.clientX - rect.left}px ${e.clientY - rect.top}px, black 0%, transparent 100%)`;
    layer.style.webkitMaskImage = mask;
    layer.style.maskImage = mask;
  };
  scene.onmouseleave = () => {
    layer.style.webkitMaskImage = hide;
    layer.style.maskImage = hide;
  };
}

// Budget: prefer the original label (range-safe); fall back to pence.
const budgetDisplay = r =>
  r.budget_text ? escape(r.budget_text) : (r.budget_pence != null ? pounds(r.budget_pence) : '—');

// ── Theme (shares the `devlink-theme` key with the rest of the site) ──
const MOON = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
const SUN  = '<path d="M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7zm0-5a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0v-1a1 1 0 0 1 1-1zm9-9h1a1 1 0 0 1 0 2h-1a1 1 0 0 1 0-2zM3 11H2a1 1 0 0 0 0 2h1a1 1 0 0 0 0-2zm14.66-6.07.71-.71a1 1 0 0 1 1.41 1.41l-.71.71a1 1 0 0 1-1.41-1.41zM5.64 18.36l-.71.71a1 1 0 0 1-1.41-1.41l.71-.71a1 1 0 0 1 1.41 1.41zm12.02.71-.71-.71a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1-1.41 1.41zM5.64 5.64l-.71-.71A1 1 0 0 1 6.34 3.52l.71.71A1 1 0 0 1 5.64 5.64z"/>';

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const label = document.getElementById('themeLabel');
  const icon  = document.getElementById('themeIcon');
  const logo  = document.getElementById('brandLogo');
  if (label) label.textContent = t === 'light' ? 'Dark' : 'Light';
  if (icon)  icon.innerHTML    = t === 'light' ? SUN : MOON;
  if (logo)  logo.src          = t === 'light' ? '/DevLinkRBBX-Black.png' : '/DevLinkRBBX.png';
  try { localStorage.setItem('devlink-theme', t); } catch {}
}

let savedTheme = 'dark';
try { savedTheme = localStorage.getItem('devlink-theme') || 'dark'; } catch {}
applyTheme(savedTheme);

document.getElementById('themeToggle').onclick = () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
};

// ── Auth state ──────────────────────────────────────────────
const $ = id => document.getElementById(id);
let currentUser = null;
let isStaff     = false;
let isFinance   = false;
// Access levels allowed to see money + hiring, and the tabs gated behind them.
const FINANCE_LEVELS    = ['director', 'devlink'];
const FINANCE_ONLY_TABS = ['payouts', 'ledger', 'applications', 'roster'];

async function renderAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  currentUser = session.user;

  // The Discord user id is in user_metadata.provider_id.
  const discordId = session.user.user_metadata?.provider_id
                 ?? session.user.user_metadata?.sub;

  const { data: staffRow } = await sb.from('staff_access')
    .select('access_level, display_name')
    .eq('discord_id', discordId)
    .maybeSingle();

  isStaff = !!staffRow;

  if (!isStaff) return renderNotStaff();

  $('who').textContent = `${staffRow.display_name ?? 'Staff'} (${staffRow.access_level})`;
  $('signout').style.display = 'inline-block';

  // Money and hiring tabs are Director/owner only. RLS enforces this on the
  // server (schema_phase8a_finance_tier.sql); hiding the tabs just keeps PMs
  // from opening ones that would come back empty.
  isFinance = FINANCE_LEVELS.includes(staffRow.access_level);
  document.querySelectorAll('nav button').forEach(b => {
    if (FINANCE_ONLY_TABS.includes(b.dataset.tab)) b.style.display = isFinance ? '' : 'none';
  });

  $('nav').style.display = 'flex';
  switchTab('home');
}

function renderLogin() {
  $('main').innerHTML = `
    <div class="center">
      <div class="dash-grid-cursor"></div>
      <div class="login-card">
        <span class="login-badge">Staff Access</span>

        <p>Sign in with Discord to continue. Access is granted automatically to Director, PM, and DevLink roles.</p>

function renderNotStaff() {
  $('main').innerHTML = `
    <div class="center">
      <div class="dash-grid-cursor"></div>
      <div class="login-card">
        <span class="login-badge warn">Restricted</span>

        <p>This Discord account isn't on the DevLink staff list. Access is limited to Director, PM, and DevLink roles — if that's you, sign in with the correct Discord account below.</p>
        <button class="btn" id="switch-account">Sign in with another account</button>

$('signout').onclick = async () => {

// ── Nav ─────────────────────────────────────────────────────
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => switchTab(b.dataset.tab);
});

function switchTab(name) {
  // Never open a Director-only tab for a PM, even if the button is reached.
  if (FINANCE_ONLY_TABS.includes(name) && !isFinance) name = 'home';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  ({ home: renderHome, projects: renderProjects, enquiries: renderEnquiries, applications: renderApplications, payouts: renderPayouts, ledger: renderLedger, roster: renderRoster }[name]?.());
}

// ── Phase 8b: shared project model + helpers ────────────────
const DAY_MS = 86400000;
const ACTIVE_PROJECT_STATUSES = ['enquiry','scoped','quoted','awaiting_payment','active','delivered'];
let myPersonId = null;
let myPersonIdLoaded = false;

async function ensureMyPersonId() {
  if (myPersonIdLoaded) return myPersonId;
  const { data } = await sb.rpc('my_person_id');
  myPersonId = data ?? null;
  myPersonIdLoaded = true;
  return myPersonId;
}

const codenameOf = p => p?.dev_codename ?? p?.client_codename ?? p?.codename ?? '—';

function whoseTurn(status, pay, devCount) {
  if (status === 'closed' || status === 'cancelled') return null;
  if (status === 'delivered') return 'Awaiting sign-off';
  if (pay === 'unpaid') return 'Awaiting payment';
  if (devCount === 0)   return 'Needs a developer';
  return 'With developer';
}

// Build enriched project rows once; shared by Home and Projects. Degrades
// gracefully if the Phase 8b RPCs aren't deployed yet (no badges / no "mine").
async function loadProjects() {
  await ensureMyPersonId();
  const { data: rows, error } = await sb.from('dl_projects')
    .select('id, title, client_id, pm_id, status, budget_pence, timeline_start, timeline_days, last_activity_at, created_at, closed_at, pm_assignment_status, pm_decline_reason, pm_declined_by, pm_responded_at')
    .order('created_at', { ascending: false });
  if (error) throw error;
  const list = rows ?? [];

  const devLinks = list.length ? ((await sb.from('project_devs').select('project_id, person_id')).data ?? []) : [];
  const personIds = [...new Set([
    ...list.map(r => r.client_id), ...list.map(r => r.pm_id), ...list.map(r => r.pm_declined_by), ...devLinks.map(d => d.person_id),
  ].filter(Boolean))];
  const { data: people } = personIds.length
    ? await sb.from('people').select('id, codename, client_codename, dev_codename, display_name').in('id', personIds)
    : { data: [] };
  const pById = new Map((people ?? []).map(p => [p.id, p]));
  const devsByProject = new Map();
  for (const d of devLinks) {
    if (!devsByProject.has(d.project_id)) devsByProject.set(d.project_id, []);
    devsByProject.get(d.project_id).push(pById.get(d.person_id));
  }

  const { data: payRows } = await sb.rpc('project_payment_statuses');
  const payById = new Map((payRows ?? []).map(p => [p.project_id, p.status]));

  const now = Date.now();
  return list.map(r => {
    const active = ACTIVE_PROJECT_STATUSES.includes(r.status);
    const devs = (devsByProject.get(r.id) ?? []).filter(Boolean);
    const pay = payById.get(r.id) ?? 'unknown';
    let due = null, daysLeft = null;
    if (r.timeline_start && r.timeline_days != null) {
      due = new Date(r.timeline_start).getTime() + r.timeline_days * DAY_MS;
      daysLeft = Math.ceil((due - now) / DAY_MS);
    }
    const overdue = active && daysLeft != null && daysLeft < 0;
    const dueSoon = active && daysLeft != null && daysLeft >= 0 && daysLeft <= 7;
    const lastAct = r.last_activity_at ? new Date(r.last_activity_at).getTime() : null;
    const staleDays = lastAct != null ? Math.floor((now - lastAct) / DAY_MS) : null;
    const stale = active && staleDays != null && staleDays >= 7;
    const assignStatus = r.pm_assignment_status ?? null;
    return {
      ...r, active, client: pById.get(r.client_id), pm: pById.get(r.pm_id), devs, pay,
      due, daysLeft, overdue, dueSoon, staleDays, stale,
      mine: !!(myPersonId && r.pm_id === myPersonId),
      turn: whoseTurn(r.status, pay, devs.length),
      assignStatus,
      declinedBy: pById.get(r.pm_declined_by),
      declineReason: r.pm_decline_reason ?? null,
      awaitingAcceptance: active && !!r.pm_id && assignStatus === 'pending',
      declined: active && assignStatus === 'declined' && !r.pm_id,
    };
  });
}

const payChip = pay => pay === 'paid' ? '<span class="chip paid dot">Paid</span>'
  : pay === 'partial' ? '<span class="chip partial dot">Part-paid</span>'
  : pay === 'unpaid' ? '<span class="chip unpaid dot">Unpaid</span>' : '';

// Colour a dev availability status: green = accepting, amber = limited, red = not.
function availChip(status) {
  const s = (status || 'accepting').toLowerCase();
  const cls = (s.includes('not') || s.includes('un') || s.includes('closed')) ? 'unpaid'
            : (s.includes('limit') || s.includes('busy') || s.includes('partial')) ? 'partial' : 'paid';
  return `<span class="chip ${cls} dot">${escape(status || 'accepting')}</span>`;
}
function deadlineChip(p) {
  if (p.daysLeft == null) return '';
  if (p.overdue) return `<span class="chip overdue">Overdue ${Math.abs(p.daysLeft)}d</span>`;
  if (p.dueSoon) return `<span class="chip due">Due ${p.daysLeft}d</span>`;
  return `<span class="chip">Due ${p.daysLeft}d</span>`;
}

// ── Home / overview ─────────────────────────────────────────
async function renderHome() {
  $('main').innerHTML = `<h2>Overview</h2><div id="home-body">Loading…</div>`;
  let model;
  try { model = await loadProjects(); }
  catch (e) { return $('home-body').innerHTML = `<div class="empty">Error: ${escape(e.message)}</div>`; }

  const mine        = model.filter(p => p.mine && p.active);
  const dueSoon     = mine.filter(p => p.dueSoon || p.overdue);
  const stalled     = mine.filter(p => p.stale);
  const unassigned  = model.filter(p => p.active && !p.pm_id);
  const awaiting    = model.filter(p => p.awaitingAcceptance);
  const declinedLst = model.filter(p => p.declined);

  const tile = (val, label, cls, go) =>
    `<div class="stat-tile ${cls} click" data-go="${go}"><div class="stat-value">${val}</div><div class="stat-label">${label}</div></div>`;
  let tiles =
    tile(mine.length, 'My active projects', '', 'projects') +
    tile(dueSoon.length, 'Due / overdue', dueSoon.length ? 'warn' : '', 'projects') +
    tile(stalled.length, 'Stalled 7d+', stalled.length ? 'rose' : '', 'projects') +
    tile(awaiting.length, 'Awaiting acceptance', awaiting.length ? 'warn' : '', 'projects') +
    tile(declinedLst.length, 'Declined', declinedLst.length ? 'rose' : '', 'projects') +
    tile(unassigned.length, 'Unassigned', '', 'projects');

  if (isFinance) {
    const [{ count: pendingPays }, { data: unpaidAllocs }] = await Promise.all([
      sb.from('ledger').select('id', { count: 'exact', head: true }).eq('direction','in').eq('status','pending'),
      sb.from('allocations').select('id').is('payout_ledger_id', null).not('party_id','is',null),
    ]);
    tiles += tile(pendingPays ?? 0, 'Unconfirmed payments', (pendingPays ? 'warn' : ''), 'ledger') +
             tile((unpaidAllocs ?? []).length, 'Outstanding payouts', '', 'payouts');
  }

  const attn = model
    .filter(p => p.active && (p.overdue || p.stale || p.pay === 'unpaid' || p.awaitingAcceptance || p.declined))
    .sort((a,b) => (b.mine - a.mine)
      || (((b.declined?3:0)+(b.overdue?2:0)+(b.stale?1:0)) - ((a.declined?3:0)+(a.overdue?2:0)+(a.stale?1:0))))
    .slice(0, 10);
  const attnRow = p => {
    const flags = [
      p.declined ? '<span class="chip stale">Declined</span>' : '',
      p.awaitingAcceptance ? '<span class="chip due">Awaiting acceptance</span>' : '',
      p.overdue ? `<span class="chip overdue">Overdue ${Math.abs(p.daysLeft)}d</span>` : '',
      p.stale ? `<span class="chip stale">Stalled ${p.staleDays}d</span>` : '',
      p.pay === 'unpaid' ? '<span class="chip unpaid dot">Unpaid</span>' : '',
      p.mine ? '<span class="chip mine">Mine</span>' : '',
    ].filter(Boolean).join(' ');
    return `<div class="attn-row"><div><div class="ar-title">${escape(p.title)}</div>
      <div class="ar-id">${escape(p.id)} · ${escape(codenameOf(p.client))}</div></div>
      <span class="spacer"></span>${flags}</div>`;
  };

  // Team availability — PM workload and developer availability (both staff-visible).
  const [{ data: staffLoad }, { data: devs }] = await Promise.all([
    sb.rpc('staff_workload'), sb.rpc('dev_availability'),
  ]);
  const teamRow = (title, sub, right) =>
    `<div class="attn-row"><div><div class="ar-title">${title}</div><div class="ar-id">${sub}</div></div>
      <span class="spacer"></span>${right}</div>`;
  const pmList = (staffLoad ?? []).length
    ? (staffLoad ?? []).map(s => teamRow(escape(s.display_name ?? s.discord_id), escape(s.access_level),
        `<span class="chip">${s.active_projects} active</span>`)).join('')
    : '<div class="empty">No staff.</div>';
  const devList = (devs ?? []).length
    ? (devs ?? []).map(d => teamRow(escape(d.name ?? d.discord_id), 'developer',
        `${availChip(d.availability_status)}<span class="chip">${d.active_projects} active</span>`)).join('')
    : '<div class="empty">No developers.</div>';

  $('home-body').innerHTML = `
    <div class="stat-grid">${tiles}</div>
    <h2>Needs attention</h2>
    ${attn.length ? attn.map(attnRow).join('') : `<div class="empty">Nothing needs attention. Nice.</div>`}
    <h2>Team availability</h2>
    <div class="card-grid">
      <div><h2 style="margin-bottom:10px;">PMs &amp; staff</h2>${pmList}</div>
      <div><h2 style="margin-bottom:10px;">Developers</h2>${devList}</div>
    </div>`;
  document.querySelectorAll('#home-body [data-go]').forEach(t => t.onclick = () => switchTab(t.dataset.go));
}

// ── Projects (cards) ────────────────────────────────────────
let projectsScope = 'mine';

function projectCard(p) {
  const devLabel = p.devs.length ? p.devs.map(codenameOf).join(', ') : '—';
  const assigned = !!p.pm;
  const pending = p.assignStatus === 'pending';

  const statusChip = !p.active ? ''
    : pending ? '<span class="chip due">Awaiting acceptance</span>'
    : p.assignStatus === 'accepted' ? '<span class="chip paid dot">Accepted</span>'
    : '';

  let actions;
  if (p.mine && pending) {
    // The assigned PM responds to their own handoff.
    actions = `<button class="btn success" data-accept="${escape(p.id)}">Accept</button>`
            + `<button class="btn danger" data-decline="${escape(p.id)}">Decline</button>`;
  } else {
    actions = `<button class="btn ${assigned ? 'success' : 'ghost'}" data-assign="${escape(p.id)}">${assigned ? 'Reassign PM' : 'Assign PM'}</button>`
            + (p.mine ? `<button class="linkbtn" data-release="${escape(p.id)}">Release</button>` : '');
  }

  const declinedNote = p.declined
    ? `<span style="color:var(--danger)">Declined${p.declinedBy ? ` by ${escape(p.declinedBy.display_name ?? codenameOf(p.declinedBy))}` : ''}: <b>${escape(p.declineReason ?? 'no reason given')}</b></span>`
    : '';

  return `<div class="proj-card ${p.mine ? 'mine' : ''} ${p.declined ? 'declined' : ''}">
    <div class="pc-top"><span class="pc-id">${escape(p.id)}</span><span class="pill">${escape(p.status)}</span></div>
    <div class="pc-title">${escape(p.title)}</div>
    <div class="pc-meta">
      <span>Client <b>${escape(codenameOf(p.client))}</b>${p.client?.display_name ? ` · ${escape(p.client.display_name)}` : ''}</span>
      <span>Dev <b>${escape(devLabel)}</b></span>
      <span>PM <b>${p.pm ? escape(p.pm.display_name ?? codenameOf(p.pm)) : 'Unassigned'}</b></span>
      ${declinedNote}
      <span>${p.staleDays != null ? `Last activity ${p.staleDays === 0 ? 'today' : p.staleDays + 'd ago'}` : 'No activity yet'}</span>
    </div>
    <div class="pc-chips">
      ${statusChip}
      ${p.turn ? `<span class="chip mine">${escape(p.turn)}</span>` : ''}
      ${payChip(p.pay)}${deadlineChip(p)}
      ${p.stale ? `<span class="chip stale">Stalled ${p.staleDays}d</span>` : ''}
    </div>
    <div class="pc-foot"><span class="spacer"></span>${actions}</div>
  </div>`;
}

async function renderProjects() {
  $('main').innerHTML = `<h2>Projects</h2><div id="projects-body">Loading…</div>`;
  let model;
  try { model = await loadProjects(); }
  catch (e) { return $('projects-body').innerHTML = `<div class="empty">Error: ${escape(e.message)}</div>`; }

  const paint = () => {
    const scoped = projectsScope === 'mine' ? model.filter(p => p.mine) : model;
    $('projects-body').innerHTML = `
      <div class="toolbar">
        <div class="seg">
          <button data-scope="mine" class="${projectsScope==='mine'?'on':''}">My projects</button>
          <button data-scope="all"  class="${projectsScope==='all'?'on':''}">All</button>
        </div>
        <span class="spacer"></span>
        <span style="color:var(--muted);font-size:12px;">${scoped.length} shown</span>
      </div>
      ${scoped.length
        ? `<div class="card-grid">${scoped.map(projectCard).join('')}</div>`
        : `<div class="empty">${projectsScope==='mine'
            ? 'No projects assigned to you yet. Switch to All and use “Assign to me”.'
            : 'No projects yet.'}</div>`}`;
    document.querySelectorAll('#projects-body [data-scope]').forEach(b => b.onclick = () => { projectsScope = b.dataset.scope; paint(); });
    document.querySelectorAll('#projects-body [data-assign]').forEach(b => b.onclick = () => openAssignModal(b.dataset.assign));
    document.querySelectorAll('#projects-body [data-release]').forEach(b => b.onclick = () => releaseProject(b.dataset.release));
    document.querySelectorAll('#projects-body [data-accept]').forEach(b => b.onclick = () => acceptAssignment(b.dataset.accept));
    document.querySelectorAll('#projects-body [data-decline]').forEach(b => b.onclick = () => declineAssignment(b.dataset.decline));
  };
  paint();
}

// targetDiscord null = assign myself (any staff); a discord id = assign that
// person (Director/owner only — enforced by the assign_pm RPC).
async function assignPm(projectId, targetDiscord) {
  const { error } = await sb.rpc('assign_pm', { p_project_id: projectId, p_target_discord_id: targetDiscord ?? null });
  if (error) return alert(`Could not assign: ${error.message}`);
  myPersonIdLoaded = false;   // a people row may have just been created for us
  document.querySelector('.modal-overlay')?.remove();
  renderProjects();
}

async function openAssignModal(projectId) {
  // PMs can only assign themselves — no picker needed.
  if (!isFinance) return assignPm(projectId, null);

  const { data: staff } = await sb.rpc('staff_workload');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>Assign PM</h3>
      <div class="modal-actions" style="justify-content:flex-start;margin:0 0 14px;">
        <button class="btn" id="assign-self">Assign to me</button>
      </div>
      <div id="assign-list">${(staff ?? []).length ? (staff ?? []).map(s => `
        <div class="attn-row">
          <div><div class="ar-title">${escape(s.display_name ?? s.discord_id)}</div>
            <div class="ar-id">${escape(s.access_level)} · ${s.active_projects} active</div></div>
          <span class="spacer"></span>
          <button class="btn ghost" data-assignto="${escape(s.discord_id)}">Assign</button>
        </div>`).join('') : '<div class="empty">No staff found.</div>'}</div>
      <div class="modal-actions"><button class="btn ghost" id="assign-cancel">Close</button></div>

async function releaseProject(id) {
  if (!confirm('Release this project (clear its PM)?')) return;
  const { error } = await sb.rpc('release_project_pm', { p_project_id: id });
  if (error) return alert(`Could not release: ${error.message}`);
  renderProjects();
}

// The assigned PM responds to their own handoff.
async function acceptAssignment(id) {
  const { error } = await sb.rpc('accept_assignment', { p_project_id: id });
  if (error) return alert(`Could not accept: ${error.message}`);
  renderProjects();
}
async function declineAssignment(id) {
  const reason = prompt('Reason for declining (the Director will see this):');
  if (reason === null) return;                       // cancelled
  if (!reason.trim()) return alert('Please give a reason so it can be reassigned.');
  const { error } = await sb.rpc('decline_assignment', { p_project_id: id, p_reason: reason.trim() });
  if (error) return alert(`Could not decline: ${error.message}`);
  renderProjects();
}

// ── Enquiries ───────────────────────────────────────────────
const ENQUIRY_STAGES = [
  ['new',          'New'],
  ['under_review', 'Under Review'],
  ['accepted',     'Accepted'],
  ['in_progress',  'In Progress'],
  ['completed',    'Completed'],
  ['declined',     'Declined'],
];
// Stages that count as active project work vs incoming enquiries.
const ACTIVE_STAGES = ['in_progress', 'completed'];
// Tone applied to the stage <select> per stage.
const STAGE_TONE = {
  new: '', under_review: 's-amber', accepted: 's-green',
  in_progress: 's-amber', completed: 's-green', declined: 's-rose',
};

// Cache of the last-loaded enquiries, so the Edit button can find its row.
let enquiryCache = new Map();

// Create / edit an enquiry. `existing` null = create (staff-only RPC),
// otherwise edit (allowed by the existing staff update policy). Values are
// set via .value, never interpolated, so no field can inject markup.
function openEnquiryModal(existing) {
  const isEdit = !!existing;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>${isEdit ? 'Edit enquiry' : 'New enquiry'}</h3>
      <div class="modal-field"><label>Project / type</label><input id="mf-name"></div>
      <div class="modal-field"><label>Budget</label><input id="mf-budget" placeholder="e.g. £250 – £500"></div>
      <div class="modal-field"><label>Timeline</label><input id="mf-timeline"></div>
      <div class="modal-field"><label>Description / brief</label><textarea id="mf-desc"></textarea></div>
      <div class="modal-actions">
        <button class="btn ghost" id="mf-cancel">Cancel</button>
        <button class="btn" id="mf-save">${isEdit ? 'Save changes' : 'Create enquiry'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const q = sel => overlay.querySelector(sel);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  q('#mf-cancel').onclick = close;
  if (isEdit) {
    q('#mf-name').value     = existing.project_name  ?? '';
    q('#mf-budget').value   = existing.budget_text   ?? '';
    q('#mf-timeline').value = existing.timeline_text ?? '';
    q('#mf-desc').value     = existing.description   ?? '';
  }
  q('#mf-save').onclick = async () => {
    const name = q('#mf-name').value.trim(), budget = q('#mf-budget').value.trim();
    const timeline = q('#mf-timeline').value.trim(), desc = q('#mf-desc').value.trim();
    const btn = q('#mf-save'); btn.disabled = true;
    let error;
    if (isEdit) {
      ({ error } = await sb.from('enquiries').update({
        project_name: name || null, budget_text: budget || null,
        timeline_text: timeline || null, description: desc || null,
      }).eq('id', existing.id));
    } else {
      ({ error } = await sb.rpc('create_manual_enquiry', {
        p_project_name: name, p_description: desc, p_budget_text: budget, p_timeline_text: timeline,
      }));
    }
    if (error) { btn.disabled = false; return alert(`Failed: ${error.message}`); }
    close();
    renderEnquiries();
  };
}

async function renderEnquiries() {
  $('main').innerHTML = `<div id="enquiries-body">Loading…</div>`;

  const { data: rows, error } = await sb
    .from('enquiries')
    .select('id, source, project_name, description, budget_pence, budget_text, timeline_text, references_text, required_skills, referrer, status, pipeline_stage, notes, created_at, client_id, converted_project_id')
    .order('created_at', { ascending: false });

  if (error) return $('enquiries-body').innerHTML = `<div class="empty">Error: ${escape(error.message)}</div>`;

  enquiryCache = new Map((rows ?? []).map(r => [r.id, r]));
  const clientIds = [...new Set((rows ?? []).map(r => r.client_id).filter(Boolean))];
  const { data: people } = await sb.from('people').select('id, codename, client_codename, display_name, email').in('id', clientIds);
  const byId = new Map((people ?? []).map(p => [p.id, p]));

  const stageSelect = r => {
    const stage = r.pipeline_stage ?? 'new';
    return `<select class="stage ${STAGE_TONE[stage] || ''}" data-stage="${escape(r.id)}">
      ${ENQUIRY_STAGES.map(([v, label]) =>
        `<option value="${v}"${stage === v ? ' selected' : ''}>${label}</option>`).join('')}
    </select>`;
  };

  const rowHtml = r => {
    const c = byId.get(r.client_id);
    const stage = r.pipeline_stage ?? 'new';
    const n = parseNotes(r.notes);
    const detail = detailGrid([
      ['Project Type',      r.project_name],
      ['Budget',            r.budget_text ?? (r.budget_pence != null ? pounds(r.budget_pence) : null)],
      ['Timeline',          r.timeline_text],
      ['Preferred Contact', n.contactMethod],
      ['Discord',           n.discord],
      ['Roblox Username',   n.robloxUsername],
      ['Game Link',         n.gameLink],
      ['Required Skills',   Array.isArray(r.required_skills) ? r.required_skills.join(', ') : r.required_skills],
      ['Referrer',          r.referrer],
      ['Bot Status',        r.status],
      ['Description',       r.description, { wide: true }],
      ['References',        r.references_text, { wide: true }],
    ]);
    return `<tr class="stg-${stage}">
      <td><code>${escape(r.id)}</code></td>
      <td>${escape(r.source)}</td>
      <td>${escape(r.project_name ?? '')}</td>
      <td>${escape(c?.client_codename ?? c?.codename ?? '—')} ${c?.email ? `<span class="pill">${escape(c.email)}</span>` : ''}</td>
      <td>${budgetDisplay(r)}</td>
      <td>${stageSelect(r)}</td>
      <td>${fmt(r.created_at)}</td>
      <td><div class="row-actions"><button class="linkbtn" data-editenq="${escape(r.id)}">Edit</button><button class="linkbtn" data-toggle="enq-${escape(r.id)}">See more</button></div></td>
    </tr>
    ${detailRow(`enq-${escape(r.id)}`, 8, detail)}`;
  };

  const tableFor = (list, emptyMsg) => list.length ? `
    <div class="table-scroll"><table>
      <thead><tr><th>ID</th><th>Source</th><th>Project</th><th>Client</th><th>Budget</th><th>Stage</th><th>Created</th><th></th></tr></thead>
      <tbody>${list.map(rowHtml).join('')}</tbody>
    </table></div>` : `<div class="empty">${emptyMsg}</div>`;

  const enquiryList = (rows ?? []).filter(r => !ACTIVE_STAGES.includes(r.pipeline_stage));
  const projectList = (rows ?? []).filter(r => ACTIVE_STAGES.includes(r.pipeline_stage));

  $('main').innerHTML = `
    <div class="toolbar"><span class="spacer"></span><button class="btn" id="new-enquiry">New enquiry</button></div>
    <h2>Incoming Enquiries (${enquiryList.length})</h2>
    ${tableFor(enquiryList, 'No incoming enquiries. Accepted work in progress shows under Active Projects.')}
    <h2>Active Projects (${projectList.length})</h2>
    ${tableFor(projectList, 'No active projects yet. Set an accepted enquiry to “In Progress” to move it here.')}`;

  $('new-enquiry').onclick = () => openEnquiryModal(null);
  document.querySelectorAll('[data-editenq]').forEach(b => b.onclick = () => openEnquiryModal(enquiryCache.get(b.dataset.editenq)));
  wireToggles();
  document.querySelectorAll('[data-stage]').forEach(sel => {
    sel.onchange = async () => {
      const id = sel.dataset.stage;
      const stage = sel.value;
      const patch = { pipeline_stage: stage };
      // Declining from here is a real action: the bot picks it up within a
      // minute, DMs the client the reason, archives their ticket channel,
      // and updates the Discord embeds. So confirm, and ask for the reason.
      if (stage === 'declined') {
        const reason = prompt('Decline this enquiry?\n\nReason to send the client (leave blank for none). The bot will DM them and archive their Discord ticket.');
        if (reason === null) { renderEnquiries(); return; }   // cancelled
        patch.status = 'declined';
        patch.decline_reason = reason.trim() || null;
      }
      sel.disabled = true;
      const { error } = await sb.from('enquiries').update(patch).eq('id', id);
      if (error) alert(`Failed: ${error.message}`);
      renderEnquiries(); // re-render so the row moves to the correct section
    };
  });
}

async function renderLedger() {
  $('main').innerHTML = `<h2>Ledger</h2><div id="ledger-body">Loading…</div>`;

  const { data: rows, error } = await sb
    .from('ledger')
    .select('id, project_id, direction, amount_pence, method, reference, status, created_at, confirmed_at, confirmed_by')
    .order('created_at', { ascending: false })
    .limit(200);

  if (error) return $('ledger-body').innerHTML = `<div class="empty">Error: ${escape(error.message)}</div>`;
  if (!rows?.length) return $('ledger-body').innerHTML = `<div class="empty">No ledger entries yet.</div>`;

  const pill = r => r.status === 'confirmed' ? `<span class="pill ok">confirmed</span>`
                : r.status === 'pending'   ? `<span class="pill pending">pending</span>`
                :                            `<span class="pill danger">${escape(r.status)}</span>`;

  $('ledger-body').innerHTML = `
    <div class="table-scroll"><table>
      <thead><tr><th>Reference</th><th>Project</th><th>Direction</th><th>Amount</th><th>Status</th><th>Created</th><th>Confirmed</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td><code>${escape(r.reference)}</code></td>
          <td>${escape(r.project_id ?? '—')}</td>
          <td>${escape(r.direction)}</td>
          <td>${pounds(r.amount_pence)}</td>
          <td>${pill(r)}</td>
          <td>${fmt(r.created_at)}</td>
          <td>${r.confirmed_at ? `${fmt(r.confirmed_at)}<br><span class="pill">${escape(r.confirmed_by ?? '')}</span>` : '—'}</td>
          <td>${r.status === 'pending' && r.direction === 'in' ? `<button class="btn success" data-confirm="${escape(r.reference)}">Confirm</button>` : ''}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <p style="color:var(--muted); font-size:12px; margin-top:16px;">
      Confirming here creates the allocation rows automatically, exactly as the Discord
      "Confirm Payment Received" button does. Both routes run the same split in the database,
      so it does not matter which you use. Only confirm once you have actually seen the money arrive.
    </p>`;

  document.querySelectorAll('[data-confirm]').forEach(b => {
    b.onclick = async () => {
      const ref = b.dataset.confirm;
      if (!confirm(`Confirm payment ${ref}?`)) return;
      const { error } = await sb.from('ledger')
        .update({ status: 'confirmed', confirmed_at: new Date().toISOString(), confirmed_by: currentUser?.user_metadata?.full_name ?? 'Dashboard' })
        .eq('reference', ref)
        .eq('status', 'pending');   // idempotency guard: never re-stamp an already-confirmed row
      if (error) alert(`Failed: ${error.message}`);
      renderLedger();
    };
  });
}

// ── Payouts ─────────────────────────────────────────────────
async function renderPayouts() {
  $('main').innerHTML = `<h2>Payouts</h2><div id="payouts-body">Loading…</div>`;

  // Fetch unpaid allocations with joined person.
  const { data: allocs, error } = await sb
    .from('allocations')
    .select('id, party_id, role, amount_pence, people:party_id(codename, dev_codename, display_name, paypal_handle)')
    .is('payout_ledger_id', null)
    .not('party_id', 'is', null);

  if (error) return $('payouts-body').innerHTML = `<div class="empty">Error: ${escape(error.message)}</div>`;
  if (!allocs?.length) return $('payouts-body').innerHTML = `<div class="empty">Nothing outstanding. Everyone's paid.</div>`;

  const byParty = new Map();
  for (const a of allocs) {
    if (!byParty.has(a.party_id)) {
      byParty.set(a.party_id, {
        partyId: a.party_id,
        codename: a.people?.dev_codename ?? a.people?.codename ?? '—',
        displayName: a.people?.display_name ?? '',
        paypal: a.people?.paypal_handle ?? '',
        total: 0,
        allocationIds: [],
      });
    }
    const b = byParty.get(a.party_id);
    b.total += a.amount_pence;
    b.allocationIds.push(a.id);
  }
  const groups = [...byParty.values()].sort((a, b) => b.total - a.total);

  $('payouts-body').innerHTML = `
    <div class="table-scroll"><table>
      <thead><tr><th>Codename</th><th>Name</th><th>PayPal</th><th>Allocations</th><th>Owed</th><th></th></tr></thead>
      <tbody>
        ${groups.map(g => `<tr>
          <td><code>${escape(g.codename)}</code></td>
          <td>${escape(g.displayName)}</td>
          <td>${g.paypal ? `<code>${escape(g.paypal)}</code>` : '<span class="pill">not set</span>'}</td>
          <td>${g.allocationIds.length}</td>
          <td>${pounds(g.total)}</td>
          <td><button class="btn success"
                       data-pay="${escape(g.partyId)}"
                       data-code="${escape(g.codename)}"
                       data-amt="${g.total}"
                       data-ids="${escape(g.allocationIds.join(','))}">Mark Paid</button></td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <p style="color:var(--muted); font-size:12px; margin-top:16px;">
      "Mark Paid" inserts a confirmed outbound ledger row and links every allocation to it. Only mark
      after you've actually sent the money in PayPal.
    </p>`;

  document.querySelectorAll('[data-pay]').forEach(b => {
    b.onclick = () => markPaid({
      partyId:       b.dataset.pay,
      codename:      b.dataset.code,
      amountPence:   Number(b.dataset.amt),
      allocationIds: b.dataset.ids.split(','),
    });
  });
}

async function markPaid({ partyId, codename, amountPence, allocationIds }) {
  const externalRef = prompt(`External payment reference for ${codename}? (PayPal transaction ID or a note)`);
  if (!externalRef) return;

  const reference = `PAYOUT-${codename}-${Date.now().toString(36).toUpperCase()}`;
  const now = new Date().toISOString();

  const { data: ledger, error: lErr } = await sb.from('ledger').insert({
    project_id:   null,
    direction:    'out',
    party_id:     partyId,
    amount_pence: amountPence,
    method:       'paypal',
    reference,
    status:       'confirmed',
    notes:        `Payout to ${codename}. External ref: ${externalRef}. Marked via dashboard.`,
    confirmed_at: now,
    confirmed_by: currentUser?.user_metadata?.full_name ?? 'Dashboard',
  }).select().single();
  if (lErr) return alert(`Ledger insert failed: ${lErr.message}`);

  const { error: aErr } = await sb.from('allocations')
    .update({ payout_ledger_id: ledger.id })
    .in('id', allocationIds);
  if (aErr) return alert(`Ledger row created but allocation update failed: ${aErr.message}`);

  renderPayouts();
}

    .order('created_at', { ascending: false });

  if (error) return $('apps-body').innerHTML = `<div class="empty">Error: ${escape(error.message)}</div>`;
  if (!rows?.length) return $('apps-body').innerHTML = `<div class="empty">No applications awaiting review. Accepted developers are on the Roster.</div>`;

  const statusPill = s => {
    const [, label, cls] = APP_STAGES.find(x => x[0] === s) ?? [s, s, ''];
    return `<span class="pill ${cls}">${escape(label)}</span>`;
  };

  $('apps-body').innerHTML = `
    <div class="table-scroll"><table>
      <thead><tr><th>Codename</th><th>Name</th><th>Email</th><th>Applied</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td><code>${escape(r.dev_codename ?? r.codename ?? '')}</code></td>
          <td>${escape(r.display_name ?? '')}</td>
          <td>${escape(r.email ?? '')}</td>
          <td>${fmt(r.created_at)}</td>
          <td>${statusPill(r.application_status)}</td>
          <td><div class="row-actions">
            <button class="linkbtn" data-toggle="app-${escape(r.id)}">See more</button>
            ${r.application_status !== 'under_review' && r.application_status !== 'declined' ? `<button class="btn ghost" data-appset="under_review" data-id="${escape(r.id)}">Review</button>` : ''}
            <button class="btn success" data-appset="accepted" data-id="${escape(r.id)}" data-code="${escape(r.dev_codename ?? r.codename ?? '')}">Accept</button>
            ${r.application_status !== 'declined' ? `<button class="btn danger" data-appset="declined" data-id="${escape(r.id)}">Decline</button>` : ''}
          </div></td>
        </tr>
        ${detailRow(`app-${escape(r.id)}`, 6, developerDetail(r))}`).join('')}
      </tbody>
    </table></div>`;

  wireToggles();
  document.querySelectorAll('[data-appset]').forEach(b => {
    b.onclick = async () => {
      const status = b.dataset.appset;
      if (status === 'accepted' && !confirm(`Accept ${b.dataset.code || 'this applicant'} onto the roster?`)) return;
      if (status === 'declined' && !confirm('Decline this application?')) return;
      const { error } = await sb.from('people').update({ application_status: status }).eq('id', b.dataset.id);
      if (error) alert(`Failed: ${error.message}`);
      renderApplications();
    };
  });
}

// ── Roster (accepted developers only) ───────────────────────
async function renderRoster() {
  $('main').innerHTML = `<h2>Roster</h2><div id="roster-body">Loading…</div>`;

  const { data: rows, error } = await sb
    .from('people')
    .select('id, codename, dev_codename, display_name, email, age_status, paypal_handle, application_status, notes, created_at')
    .eq('kind', 'developer')
    .eq('application_status', 'accepted')
    .order('codename', { ascending: true });

  if (error) return $('roster-body').innerHTML = `<div class="empty">Error: ${escape(error.message)}</div>`;
  if (!rows?.length) return $('roster-body').innerHTML = `<div class="empty">No accepted developers yet. Review new applicants under the Applications tab.</div>`;

  $('roster-body').innerHTML = `
    <div class="table-scroll"><table>
      <thead><tr><th>Codename</th><th>Name</th><th>Email</th><th>Age</th><th>PayPal</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td><code>${escape(r.dev_codename ?? r.codename ?? '')}</code></td>
          <td>${escape(r.display_name ?? '')}</td>
          <td>${escape(r.email ?? '')}</td>
          <td>${escape(AGE_LABEL[r.age_status] ?? r.age_status ?? '')}</td>
          <td>${r.paypal_handle ? `<code>${escape(r.paypal_handle)}</code>` : '<span class="pill">not set</span>'}</td>
          <td><div class="row-actions">
            <button class="linkbtn" data-toggle="ros-${escape(r.id)}">See more</button>
            <button class="btn ghost" data-editpp="${escape(r.id)}" data-cur="${escape(r.paypal_handle ?? '')}">Edit PayPal</button>
          </div></td>
        </tr>
        ${detailRow(`ros-${escape(r.id)}`, 6, developerDetail(r))}`).join('')}
      </tbody>
    </table></div>`;

  wireToggles();
  document.querySelectorAll('[data-editpp]').forEach(b => {
    b.onclick = async () => {
      const cur = b.dataset.cur;
      const next = prompt('PayPal handle (leave blank to clear):', cur);
      if (next === null) return;
      const { error } = await sb.from('people').update({ paypal_handle: next || null }).eq('id', b.dataset.editpp);
      if (error) alert(`Failed: ${error.message}`);
      renderRoster();
    };
  });
}

// Kick things off.
renderAuth();
sb.auth.onAuthStateChange(() => renderAuth());
</script>
