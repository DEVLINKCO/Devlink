<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevLink Dashboard</title>
  <style>
    :root {
      --bg:     #0e1013;
      --panel:  #16191f;
      --border: #262a33;
      --text:   #e6e8eb;
      --muted:  #8b93a1;
      --accent: #6a95ff;
      --danger: #ef4444;
      --success:#22c55e;
      --warning:#f59e0b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.5;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
    header .who { color: var(--muted); font-size: 12px; }
    nav {
      display: flex; gap: 4px; padding: 8px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    nav button {
      background: transparent; border: 0; color: var(--muted);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    nav button.active { background: var(--bg); color: var(--text); }
    main { padding: 24px; max-width: 1400px; }
    section { display: none; }
    section.active { display: block; }
    h2 { margin: 0 0 16px; font-size: 15px; font-weight: 600; }
    table {
      width: 100%; border-collapse: collapse; font-size: 13px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { background: #1a1e26; color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: 0; }
    .btn {
      background: var(--accent); color: #fff; border: 0;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    .btn.ghost   { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.danger  { background: var(--danger); }
    .btn.success { background: var(--success); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty {
      padding: 40px; text-align: center; color: var(--muted);
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: var(--border); color: var(--muted); }
    .pill.ok       { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .pill.pending  { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .pill.danger   { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .center { text-align: center; padding: 60px 24px; }
    .center h2 { margin: 0 0 8px; font-size: 22px; }
    .center p { margin: 0 0 24px; color: var(--muted); }
    .center .btn { padding: 10px 20px; font-size: 14px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: #1a1e26; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <h1>DevLink Dashboard</h1>
  <div>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="signout" style="display:none">Sign out</button>
  </div>
</header>

<nav id="nav" style="display:none">
  <button data-tab="projects"  class="active">Projects</button>
  <button data-tab="enquiries">Enquiries</button>
  <button data-tab="payouts">Payouts</button>
  <button data-tab="ledger">Ledger</button>
  <button data-tab="roster">Roster</button>
</nav>

<main id="main"></main>

<script type="module">
// ============================================================
// CONFIGURATION
// Fill these two before deploying. The anon key is safe to expose;
// RLS is what protects data (only staff can read).
// ============================================================
const SUPABASE_URL      = 'https://qgqpwxitbdjoggiwtjra.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFncXB3eGl0YmRqb2dnaXd0anJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNTM2NDYsImV4cCI6MjA5MDkyOTY0Nn0.7vXKc33-Ok-V7nOIoxw2gZ0LxjdrR0ZEp59Y1Cgej4w';
// Where Discord OAuth should send the user back after sign-in. Must
// match the URL you configured in Supabase Auth (Auth -> URL config).
const REDIRECT_TO = window.location.origin + window.location.pathname;

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── Money helpers ───────────────────────────────────────────
const pounds = pence => `£${(Number(pence ?? 0) / 100).toFixed(2)}`;
const fmt    = iso   => iso ? new Date(iso).toLocaleString() : '—';
const escape = s     => (s ?? '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── Auth state ──────────────────────────────────────────────
const $ = id => document.getElementById(id);
let currentUser = null;
let isStaff     = false;

async function renderAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  currentUser = session.user;

  // The Discord user id is in user_metadata.provider_id.
  const discordId = session.user.user_metadata?.provider_id
                 ?? session.user.user_metadata?.sub;

  const { data: staffRow } = await sb.from('staff_access')
    .select('access_level, display_name')
    .eq('discord_id', discordId)
    .maybeSingle();

  isStaff = !!staffRow;

  $('who').textContent = staffRow
    ? `${staffRow.display_name ?? 'Staff'} (${staffRow.access_level})`
    : session.user.user_metadata?.full_name ?? session.user.email ?? 'Signed in';
  $('signout').style.display = 'inline-block';

  if (!isStaff) return renderNotStaff();

  $('nav').style.display = 'flex';
  switchTab('projects');
}

function renderLogin() {
  $('main').innerHTML = `
    <div class="center">
      <h2>Staff Dashboard</h2>
      <p>Sign in with Discord to continue. Access is granted automatically to Director, PM, and DevLink roles.</p>
      <button class="btn" id="signin">Sign in with Discord</button>
    </div>`;
  $('signin').onclick = async () => {
    await sb.auth.signInWithOAuth({
      provider: 'discord',
      options:  { redirectTo: REDIRECT_TO },
    });
  };
}

function renderNotStaff() {
  $('main').innerHTML = `
    <div class="center">
      <h2>Nothing to see here</h2>
      <p>This dashboard is for DevLink staff only.</p>
    </div>`;
}

$('signout').onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

// ── Nav ─────────────────────────────────────────────────────
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => switchTab(b.dataset.tab);
});

function switchTab(name) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  ({ projects: renderProjects, enquiries: renderEnquiries, payouts: renderPayouts, ledger: renderLedger, roster: renderRoster }[name]?.());
}

// ── Projects ────────────────────────────────────────────────
async function renderProjects() {
  $('main').innerHTML = `<h2>Projects</h2><div id="projects-body">Loading…</div>`;

  const { data: rows, error } = await sb
    .from('dl_projects')
    .select('id, title, client_id, status, budget_pence, created_at, closed_at')
    .order('created_at', { ascending: false });

  if (error) return $('projects-body').innerHTML = `<div class="empty">Error: ${escape(error.message)}</div>`;
  if (!rows?.length) return $('projects-body').innerHTML = `<div class="empty">No projects yet.</div>`;

  const clientIds = [...new Set(rows.map(r => r.client_id).filter(Boolean))];
  const { data: people } = await sb.from('people').select('id, codename, display_name').in('id', clientIds);
  const byId = new Map((people ?? []).map(p => [p.id, p]));

  $('projects-body').innerHTML = `
    <table>
      <thead>
        <tr><th>ID</th><th>Title</th><th>Client</th><th>Budget</th><th>Status</th><th>Created</th></tr>
      </thead>
      <tbody>
        ${rows.map(r => {
          const c = byId.get(r.client_id);
          return `<tr>
            <td><code>${escape(r.id)}</code></td>
            <td>${escape(r.title)}</td>
            <td>${escape(c?.codename ?? '—')} <span class="pill">${escape(c?.display_name ?? '')}</span></td>
            <td>${r.budget_pence != null ? pounds(r.budget_pence) : '—'}</td>
            <td><span class="pill">${escape(r.status)}</span></td>
            <td>${fmt(r.created_at)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// ── Enquiries ───────────────────────────────────────────────
async function renderEnquiries() {
  $('main').innerHTML = `<h2>Enquiries</h2><div id="enquiries-body">Loading…</div>`;

  const { data: rows, error } = await sb
    .from('enquiries')
    .select('id, source, project_name, budget_pence, status, created_at, client_id, converted_project_id')
    .order('created_at', { ascending: false });

  if (error) return $('enquiries-body').innerHTML = `<div class="empty">Error: ${escape(error.message)}</div>`;
  if (!rows?.length) return $('enquiries-body').innerHTML = `<div class="empty">No enquiries yet.</div>`;

  const clientIds = [...new Set(rows.map(r => r.client_id).filter(Boolean))];
  const { data: people } = await sb.from('people').select('id, codename, display_name, email').in('id', clientIds);
  const byId = new Map((people ?? []).map(p => [p.id, p]));

  const statusPill = s => ({
    new:         `<span class="pill pending">new</span>`,
    progressing: `<span class="pill">progressing</span>`,
    converted:   `<span class="pill ok">converted</span>`,
    declined:    `<span class="pill danger">declined</span>`,
  }[s] ?? `<span class="pill">${escape(s)}</span>`);

  $('enquiries-body').innerHTML = `
    <table>
      <thead><tr><th>ID</th><th>Source</th><th>Project</th><th>Client</th><th>Budget</th><th>Status</th><th>Created</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r => {
          const c = byId.get(r.client_id);
          return `<tr>
            <td><code>${escape(r.id)}</code></td>
            <td>${escape(r.source)}</td>
            <td>${escape(r.project_name ?? '')}</td>
            <td>${escape(c?.codename ?? '—')} ${c?.email ? `<span class="pill">${escape(c.email)}</span>` : ''}</td>
            <td>${r.budget_pence != null ? pounds(r.budget_pence) : '—'}</td>
            <td>${statusPill(r.status)}</td>
            <td>${fmt(r.created_at)}</td>
            <td>
              ${r.status === 'new' ? `<button class="btn ghost" data-decline="${escape(r.id)}">Decline</button>` : ''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;

  document.querySelectorAll('[data-decline]').forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.decline;
      if (!confirm(`Decline enquiry ${id}?`)) return;
      const { error } = await sb.from('enquiries').update({ status: 'declined' }).eq('id', id);
      if (error) alert(`Failed: ${error.message}`);
      renderEnquiries();
    };
  });
}

// ── Ledger ──────────────────────────────────────────────────
async function renderLedger() {
  $('main').innerHTML = `<h2>Ledger</h2><div id="ledger-body">Loading…</div>`;

  const { data: rows, error } = await sb
    .from('ledger')
    .select('id, project_id, direction, amount_pence, method, reference, status, created_at, confirmed_at, confirmed_by')
    .order('created_at', { ascending: false })
    .limit(200);

  if (error) return $('ledger-body').innerHTML = `<div class="empty">Error: ${escape(error.message)}</div>`;
  if (!rows?.length) return $('ledger-body').innerHTML = `<div class="empty">No ledger entries yet.</div>`;

  const pill = r => r.status === 'confirmed' ? `<span class="pill ok">confirmed</span>`
                : r.status === 'pending'   ? `<span class="pill pending">pending</span>`
                :                            `<span class="pill danger">${escape(r.status)}</span>`;

  $('ledger-body').innerHTML = `
    <table>
      <thead><tr><th>Reference</th><th>Project</th><th>Direction</th><th>Amount</th><th>Status</th><th>Created</th><th>Confirmed</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td><code>${escape(r.reference)}</code></td>
          <td>${escape(r.project_id ?? '—')}</td>
          <td>${escape(r.direction)}</td>
          <td>${pounds(r.amount_pence)}</td>
          <td>${pill(r)}</td>
          <td>${fmt(r.created_at)}</td>
          <td>${r.confirmed_at ? `${fmt(r.confirmed_at)}<br><span class="pill">${escape(r.confirmed_by ?? '')}</span>` : '—'}</td>
          <td>${r.status === 'pending' && r.direction === 'in' ? `<button class="btn success" data-confirm="${escape(r.reference)}">Confirm</button>` : ''}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    <p style="color:var(--muted); font-size:12px; margin-top:16px;">
      Confirming from the dashboard flips the ledger row but does not create allocation rows automatically.
      Use the Discord "Confirm Payment Received" button on the project channel to trigger the full flow (ledger + allocations).
    </p>`;

  document.querySelectorAll('[data-confirm]').forEach(b => {
    b.onclick = async () => {
      const ref = b.dataset.confirm;
      if (!confirm(`Confirm payment ${ref}?`)) return;
      const { error } = await sb.from('ledger')
        .update({ status: 'confirmed', confirmed_at: new Date().toISOString(), confirmed_by: currentUser?.user_metadata?.full_name ?? 'Dashboard' })
        .eq('reference', ref);
      if (error) alert(`Failed: ${error.message}`);
      renderLedger();
    };
  });
}

// ── Payouts ─────────────────────────────────────────────────
async function renderPayouts() {
  $('main').innerHTML = `<h2>Payouts</h2><div id="payouts-body">Loading…</div>`;

  // Fetch unpaid allocations with joined person.
  const { data: allocs, error } = await sb
    .from('allocations')
    .select('id, party_id, role, amount_pence, people:party_id(codename, display_name, paypal_handle)')
    .is('payout_ledger_id', null)
    .not('party_id', 'is', null);

  if (error) return $('payouts-body').innerHTML = `<div class="empty">Error: ${escape(error.message)}</div>`;
  if (!allocs?.length) return $('payouts-body').innerHTML = `<div class="empty">Nothing outstanding. Everyone's paid.</div>`;

  const byParty = new Map();
  for (const a of allocs) {
    if (!byParty.has(a.party_id)) {
      byParty.set(a.party_id, {
        partyId: a.party_id,
        codename: a.people?.codename ?? '—',
        displayName: a.people?.display_name ?? '',
        paypal: a.people?.paypal_handle ?? '',
        total: 0,
        allocationIds: [],
      });
    }
    const b = byParty.get(a.party_id);
    b.total += a.amount_pence;
    b.allocationIds.push(a.id);
  }
  const groups = [...byParty.values()].sort((a, b) => b.total - a.total);

  $('payouts-body').innerHTML = `
    <table>
      <thead><tr><th>Codename</th><th>Name</th><th>PayPal</th><th>Allocations</th><th>Owed</th><th></th></tr></thead>
      <tbody>
        ${groups.map(g => `<tr>
          <td><code>${escape(g.codename)}</code></td>
          <td>${escape(g.displayName)}</td>
          <td>${g.paypal ? `<code>${escape(g.paypal)}</code>` : '<span class="pill">not set</span>'}</td>
          <td>${g.allocationIds.length}</td>
          <td>${pounds(g.total)}</td>
          <td><button class="btn success"
                       data-pay="${escape(g.partyId)}"
                       data-code="${escape(g.codename)}"
                       data-amt="${g.total}"
                       data-ids="${escape(g.allocationIds.join(','))}">Mark Paid</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <p style="color:var(--muted); font-size:12px; margin-top:16px;">
      "Mark Paid" inserts a confirmed outbound ledger row and links every allocation to it. Only mark
      after you've actually sent the money in PayPal.
    </p>`;

  document.querySelectorAll('[data-pay]').forEach(b => {
    b.onclick = () => markPaid({
      partyId:       b.dataset.pay,
      codename:      b.dataset.code,
      amountPence:   Number(b.dataset.amt),
      allocationIds: b.dataset.ids.split(','),
    });
  });
}

async function markPaid({ partyId, codename, amountPence, allocationIds }) {
  const externalRef = prompt(`External payment reference for ${codename}? (PayPal transaction ID or a note)`);
  if (!externalRef) return;

  const reference = `PAYOUT-${codename}-${Date.now().toString(36).toUpperCase()}`;
  const now = new Date().toISOString();

  const { data: ledger, error: lErr } = await sb.from('ledger').insert({
    project_id:   null,
    direction:    'out',
    party_id:     partyId,
    amount_pence: amountPence,
    method:       'paypal',
    reference,
    status:       'confirmed',
    notes:        `Payout to ${codename}. External ref: ${externalRef}. Marked via dashboard.`,
    confirmed_at: now,
    confirmed_by: currentUser?.user_metadata?.full_name ?? 'Dashboard',
  }).select().single();
  if (lErr) return alert(`Ledger insert failed: ${lErr.message}`);

  const { error: aErr } = await sb.from('allocations')
    .update({ payout_ledger_id: ledger.id })
    .in('id', allocationIds);
  if (aErr) return alert(`Ledger row created but allocation update failed: ${aErr.message}`);

  renderPayouts();
}

// ── Roster ──────────────────────────────────────────────────
async function renderRoster() {
  $('main').innerHTML = `<h2>Roster</h2><div id="roster-body">Loading…</div>`;

  const { data: rows, error } = await sb
    .from('people')
    .select('id, codename, display_name, email, age_status, paypal_handle, notes, created_at')
    .eq('kind', 'developer')
    .order('codename', { ascending: true });

  if (error) return $('roster-body').innerHTML = `<div class="empty">Error: ${escape(error.message)}</div>`;
  if (!rows?.length) return $('roster-body').innerHTML = `<div class="empty">No developers on the roster.</div>`;

  $('roster-body').innerHTML = `
    <table>
      <thead><tr><th>Codename</th><th>Name</th><th>Email</th><th>Age</th><th>PayPal</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td><code>${escape(r.codename ?? '')}</code></td>
          <td>${escape(r.display_name ?? '')}</td>
          <td>${escape(r.email ?? '')}</td>
          <td>${escape(r.age_status ?? '')}</td>
          <td>${r.paypal_handle ? `<code>${escape(r.paypal_handle)}</code>` : '<span class="pill">not set</span>'}</td>
          <td><button class="btn ghost" data-editpp="${escape(r.id)}" data-cur="${escape(r.paypal_handle ?? '')}">Edit PayPal</button></td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  document.querySelectorAll('[data-editpp]').forEach(b => {
    b.onclick = async () => {
      const cur = b.dataset.cur;
      const next = prompt('PayPal handle (leave blank to clear):', cur);
      if (next === null) return;
      const { error } = await sb.from('people').update({ paypal_handle: next || null }).eq('id', b.dataset.editpp);
      if (error) alert(`Failed: ${error.message}`);
      renderRoster();
    };
  });
}

// Kick things off.
renderAuth();
sb.auth.onAuthStateChange(() => renderAuth());
</script>

</body>
</html>
